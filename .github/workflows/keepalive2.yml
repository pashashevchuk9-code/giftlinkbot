name: Keep Render awake (backup)

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint (backup)
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://giftlinkbot.onrender.com/health; then
              echo "Backup ping OK"
              exit 0
            fi
            sleep 10
          done
          exit 0
