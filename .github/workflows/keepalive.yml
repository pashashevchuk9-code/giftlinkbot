name: Keep Render awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 30 https://giftlinkbot.onrender.com/health; then
              echo ""
              echo "Ping $i OK"
              exit 0
            fi
            echo "Ping $i failed, retrying..."
            sleep 5
          done
          echo "All pings failed"
          exit 0
